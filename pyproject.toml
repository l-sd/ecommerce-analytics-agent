[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-analytics-agent"
version = "1.0.0"
description = "Reproducible e-commerce analytics workflow for cleaning, KPI analysis, RFM segmentation, reporting, and validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Liu Boxu" }]
dependencies = [
  "pandas>=3.0,<4",
  "numpy>=2.2,<3",
  "openpyxl>=3.1,<4",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.6",
]
dashboard = [
  "streamlit>=1.49,<2",
]

[project.scripts]
ecommerce-analytics = "ecommerce_analytics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The dashboard prepends ``src/`` to sys.path before importing the package, which
# Streamlit Cloud does not install, so its imports cannot sit at the top.
"app.py" = ["E402"]


