[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-analytics-agent"
version = "1.0.0"
description = "Reproducible e-commerce analytics workflow for cleaning, KPI analysis, RFM segmentation, reporting, and validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Liu Boxu" }]
dependencies = [
  "pandas>=3.0,<4",
  "numpy>=2.3,<3",
  "openpyxl>=3.1,<4",
]

[project.scripts]
ecommerce-analytics = "ecommerce_analytics.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

