name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One failing combination should not cancel the rest: the interesting
      # signal is *which* platform or interpreter breaks.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    env:
      # No display anywhere, and CJK output has to survive the default codec.
      MPLBACKEND: Agg
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Every chart label is Chinese. Without a CJK font matplotlib falls back to
      # DejaVu Sans and draws boxes instead of text, so the generated artifacts
      # would be unusable even though the run "succeeds".
      - name: Install CJK fonts
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      # The unit tests cover the pieces; this proves the whole chain still runs
      # and that the ten built-in validations pass on a fresh machine.
      - name: Run the full pipeline
        run: python -m ecommerce_analytics run --input data/synthetic_orders.csv --output artifacts/ci

      - name: Upload the validation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python-version }}
          path: artifacts/ci/validation.md
          if-no-files-found: warn
